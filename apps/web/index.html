    <meta
      name="description"
      content="Narralume 本地优先的长篇故事视觉说书生产平台"

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2398511b'/%3E%3Cpath d='M8 7h16v3H11v5h11v3H11v7H8z' fill='%23fbf8f2'/%3E%3C/svg%3E" />
    <title>Narralume · 叙影</title>
    <script>
      const savedTheme = localStorage.getItem("narralume-theme");
      document.documentElement.dataset.theme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
